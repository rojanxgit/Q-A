<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Q&A 🎁</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#fff}body{background:radial-gradient(circle at 50% 15%,#343434,#111 58%,#050505);overflow:hidden}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:min(94%,500px);text-align:center;padding:28px 18px}.emoji{font-size:72px;margin-bottom:12px;animation:float 2s infinite}.step{font-size:12px;color:#999;letter-spacing:2px}.title{font-size:clamp(28px,8vw,42px);margin:12px 0}.sub{color:#ccc;font-size:16px;line-height:1.5;margin:0 auto 25px}.options{display:grid;gap:12px}.option{border:1px solid #444;background:rgba(255,255,255,.08);color:#fff;border-radius:16px;padding:17px;font-size:17px;font-weight:700;cursor:pointer;transition:.2s}.option:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}.option:active{transform:scale(.98)}.hidden{display:none!important}.final{position:fixed;inset:0;background:#000;z-index:10;display:flex;align-items:center;justify-content:center}.final iframe{width:100%;height:100%;border:0}.final h2{position:absolute;top:18px;z-index:11;font-size:28px;text-shadow:0 2px 10px #000;pointer-events:none}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
</style>
</head>
<body>
<section class="screen" id="q1"><div class="card"><div class="emoji">🤔</div><div class="step">QUESTION 1 / 3</div><h1 class="title">Let's see how well you know me...</h1><p class="sub">Pick one answer 👀</p><div class="options"><button class="option" onclick="next(1)">😎 Obviously I know you</button><button class="option" onclick="next(1)">🤨 Maybe...</button><button class="option" onclick="next(1)">💀 I have no idea</button></div></div></section>
<section class="screen hidden" id="q2"><div class="card"><div class="emoji">🧐</div><div class="step">QUESTION 2 / 3</div><h1 class="title">Okay, next one...</h1><p class="sub">What do you think is coming?</p><div class="options"><button class="option" onclick="next(2)">🎁 A gift</button><button class="option" onclick="next(2)">😂 Something funny</button><button class="option" onclick="next(2)">😈 Something suspicious</button></div></div></section>
<section class="screen hidden" id="q3"><div class="card"><div class="emoji">👀</div><div class="step">FINAL QUESTION</div><h1 class="title">Are you sure?</h1><p class="sub">This is your final answer. Choose wisely. 😭</p><div class="options"><button class="option" onclick="reveal()">🔥 YES, SHOW ME!</button></div></div></section>
<div class="final hidden" id="final"><h2>🎉 YOUR SURPRISE 🎉</h2><iframe id="video" src="https://www.youtube.com/embed/h38PBJvzq40?autoplay=1&rel=0" title="Comedy surprise" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
<script>
function next(n){document.getElementById('q'+n).classList.add('hidden');document.getElementById('q'+(n+1)).classList.remove('hidden')}
function reveal(){document.getElementById('final').classList.remove('hidden')}
</script>
</body>
</html>
